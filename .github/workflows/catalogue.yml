name: Catalogue hebdomadaire

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Construire le catalogue
        run: python build_catalog.py construire
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Verifier puis ecrire public/catalogue.json
        run: python build_catalog.py publier
      - name: Enregistrer la nouvelle version
        run: |
          git config user.name "catalogue-bot"
          git config user.email "catalogue-bot@users.noreply.github.com"
          git add public/catalogue.json
          git diff --cached --quiet || git commit -m "Catalogue du $(date +%F)"
          git push
